<!-- TEMPORARY MAP CALIBRATION TOOL (Delete when finished) -->
    <div id="coord-helper" style="position: fixed; bottom: 20px; right: 20px; background: #333; color: #fff; padding: 15px; border-radius: 8px; z-index: 9999; font-family: monospace;">
        Click anywhere on the map to get coordinates.
    </div>
    <script>
        const mapImg = document.querySelector('.map-image');
        const helper = document.getElementById('coord-helper');
        
        mapImg.addEventListener('click', function(e) {
            const rect = mapImg.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            const leftPercent = ((x / rect.width) * 100).toFixed(2);
            const topPercent = ((y / rect.height) * 100).toFixed(2);
            
            const coordString = `top: ${topPercent}%; left: ${leftPercent}%;`;
            helper.innerHTML = `<strong>Copy this:</strong><br><br>${coordString}`;
            
            // Auto-copy to clipboard
            navigator.clipboard.writeText(coordString).then(() => {
                helper.innerHTML += `<br><br><em>(Copied to clipboard!)</em>`;
            });
        });
    </script>
