<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OTF 2026 Interactive Floor Plan</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 20px;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { color: #2a663a; }
        
        .container {
            display: flex;
            flex-direction: row;
            gap: 20px;
            width: 100%;
            max-width: 1200px;
        }

        .map-container {
            flex: 1;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            padding: 20px;
            position: sticky;
            top: 20px;
            height: fit-content;
        }
        .booth {
            fill: #d1e7d5;
            stroke: #2a663a;
            stroke-width: 2;
            cursor: pointer;
            transition: fill 0.3s;
        }
        .booth:hover { fill: #8cc399; }
        .booth.active { fill: #2a663a; }
        .booth-text {
            font-size: 14px;
            font-weight: bold;
            fill: #333;
            pointer-events: none;
        }
        .booth.active + .booth-text { fill: #fff; }

        .table-container {
            flex: 1;
            max-height: 800px;
            overflow-y: auto;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        .exhibitor-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9em;
        }
        .exhibitor-table thead {
            background-color: #2a663a;
            color: #ffffff;
            position: sticky;
            top: 0;
        }
        .exhibitor-table th, .exhibitor-table td {
            padding: 14px 18px;
            border-bottom: 1px solid #e0e0e0;
            text-align: left;
        }
        .exhibitor-table tbody tr {
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .exhibitor-table tbody tr:nth-of-type(even) { background-color: #f3f3f3; }
        .exhibitor-table tbody tr:hover { background-color: #d1e7d5; }
        .exhibitor-table tbody tr.active {
            background-color: #2a663a;
            color: #fff;
        }
        .exhibitor-table tbody tr.active a { color: #fff; }
        .exhibitor-table a {
            color: #1a5327;
            text-decoration: none;
            font-weight: 600;
        }
        .exhibitor-table a:hover { text-decoration: underline; }
        
        @media (max-width: 768px) {
            .container { flex-direction: column; }
            .map-container { position: static; }
        }
    </style>
</head>
<body>
    <h1>OTF 2026 Interactive Show Floor</h1>
    <div class="container">
        <div class="map-container">
            <svg viewBox="0 0 400 400" width="100%" height="100%">
                <rect x="50" y="50" width="80" height="60" class="booth" data-booth="110" rx="4"></rect>
                <text x="90" y="85" text-anchor="middle" class="booth-text">110</text>

                <rect x="150" y="50" width="80" height="60" class="booth" data-booth="310" rx="4"></rect>
                <text x="190" y="85" text-anchor="middle" class="booth-text">310</text>

                <rect x="250" y="50" width="80" height="60" class="booth" data-booth="409" rx="4"></rect>
                <text x="290" y="85" text-anchor="middle" class="booth-text">409</text>

                <rect x="50" y="150" width="80" height="60" class="booth" data-booth="129" rx="4"></rect>
                <text x="90" y="185" text-anchor="middle" class="booth-text">129</text>

                <rect x="150" y="150" width="180" height="60" class="booth" data-booth="229" rx="4"></rect>
                <text x="240" y="185" text-anchor="middle" class="booth-text">Ag-Pro (229+)</text>
            </svg>
        </div>

        <div class="table-container">
            <table class="exhibitor-table">
                <thead>
                    <tr>
                        <th>Exhibitor Name</th>
                        <th>Booth Number(s)</th>
                    </tr>
                </thead>
                <tbody id="exhibitor-list">
                    <tr data-booths="310">
                        <td><a href="https://www.acornfarms.com/" target="_blank">Acorn Farms</a></td>
                        <td>310</td>
                    </tr>
                    <tr data-booths="110, 112">
                        <td><a href="https://acuspray.com/" target="_blank">AcuSpray</a></td>
                        <td>110, 112</td>
                    </tr>
                    <tr data-booths="409, 508">
                        <td><a href="https://www.advancedturf.com/" target="_blank">Advanced Turf Solutions</a></td>
                        <td>409, 508</td>
                    </tr>
                    <tr data-booths="129">
                        <td><a href="https://aginfotech.net/" target="_blank">Ag Info Tech</a></td>
                        <td>129</td>
                    </tr>
                    <tr data-booths="229, 231, 328, 330">
                        <td><a href="https://www.agprocompanies.com/ohio/" target="_blank">Ag-Pro Companies</a></td>
                        <td>229, 231, 328, 330</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const booths = document.querySelectorAll('.booth');
        const rows = document.querySelectorAll('#exhibitor-list tr');

        function clearActive() {
            booths.forEach(b => b.classList.remove('active'));
            rows.forEach(r => r.classList.remove('active'));
        }

        booths.forEach(booth => {
            booth.addEventListener('click', () => {
                clearActive();
                booth.classList.add('active');
                
                const boothId = booth.getAttribute('data-booth');
                const targetRow = Array.from(rows).find(row => 
                    row.getAttribute('data-booths').includes(boothId)
                );

                if (targetRow) {
                    targetRow.classList.add('active');
                    targetRow.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            });
        });

        rows.forEach(row => {
            row.addEventListener('click', (e) => {
                if(e.target.tagName.toLowerCase() === 'a') return; 

                clearActive();
                row.classList.add('active');
                
                const boothIds = row.getAttribute('data-booths').split(', ');
                boothIds.forEach(id => {
                    const targetBooth = document.querySelector(`.booth[data-booth="${id}"]`);
                    if (targetBooth) targetBooth.classList.add('active');
                });
            });
        });
    </script>
</body>
</html>
