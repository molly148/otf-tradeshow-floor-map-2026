<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OTF 2026 Interactive Floor Plan</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 20px;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { color: #2a663a; }
        
        .container {
            display: flex;
            flex-direction: row;
            gap: 20px;
            width: 100%;
            max-width: 1400px;
        }

        /* Map Styling for Image Overlay */
        .map-container {
            flex: 1.2;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            position: sticky;
            top: 20px;
            height: fit-content;
            overflow: hidden;
            position: relative; /* Crucial for overlaying booths */
        }
        
        .map-image {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Clickable Booth Zones */
        .booth {
            position: absolute;
            background-color: rgba(209, 231, 213, 0.5); /* Light green semi-transparent */
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.2s;
            border-radius: 2px;
        }
        .booth:hover { 
            background-color: rgba(140, 195, 153, 0.7); 
            border-color: #2a663a;
        }
        .booth.active { 
            background-color: rgba(42, 102, 58, 0.8); 
            border-color: #1a5327;
            box-shadow: 0 0 8px rgba(42, 102, 58, 0.8);
        }

        /* Table Styling */
        .table-container {
            flex: 0.8;
            max-height: 800px;
            overflow-y: auto;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        .exhibitor-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9em;
        }
        .exhibitor-table thead {
            background-color: #2a663a;
            color: #ffffff;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .exhibitor-table th, .exhibitor-table td {
            padding: 14px 18px;
            border-bottom: 1px solid #e0e0e0;
            text-align: left;
        }
        .exhibitor-table tbody tr {
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .exhibitor-table tbody tr:nth-of-type(even) { background-color: #f3f3f3; }
        .exhibitor-table tbody tr:hover { background-color: #d1e7d5; }
        .exhibitor-table tbody tr.active {
            background-color: #2a663a;
            color: #fff;
        }
        .exhibitor-table tbody tr.active a { color: #fff; }
        .exhibitor-table a {
            color: #1a5327;
            text-decoration: none;
            font-weight: 600;
        }
        .exhibitor-table a:hover { text-decoration: underline; }
        
        @media (max-width: 900px) {
            .container { flex-direction: column; }
            .map-container { position: static; }
        }
    </style>
</head>
<body>

    <h1>OTF 2026 Interactive Show Floor</h1>

    <div class="container">
        <!-- Interactive Map Image Overlay -->
        <div class="map-container">
            <img src="OTF-TradeShowMap-2025.png" alt="OTF Floor Plan" class="map-image" />
            
            <!-- Prototype Booth Mappings (Top/Left percentages position the box over the image) -->
            <!-- You will duplicate these lines and adjust top/left for the remaining booths -->
            <div class="booth" data-booth="110" style="top: 53.5%; left: 20%; width: 3.5%; height: 3%;"></div>
            <div class="booth" data-booth="112" style="top: 48.5%; left: 20%; width: 3.5%; height: 3%;"></div>
            <div class="booth" data-booth="310" style="top: 53.5%; left: 41%; width: 3.5%; height: 3%;"></div>
            <div class="booth" data-booth="409" style="top: 58.5%; left: 58%; width: 3.5%; height: 3%;"></div>
            <div class="booth" data-booth="508" style="top: 58.5%; left: 61.5%; width: 3.5%; height: 3%;"></div>
            <div class="booth" data-booth="129" style="top: 15%; left: 27%; width: 3.5%; height: 3%;"></div>
            <div class="booth" data-booth="229" style="top: 15%; left: 37.5%; width: 3.5%; height: 3%;"></div>
            <div class="booth" data-booth="231" style="top: 10%; left: 37.5%; width: 3.5%; height: 3%;"></div>
            <div class="booth" data-booth="328" style="top: 15%; left: 41%; width: 3.5%; height: 3%;"></div>
            <div class="booth" data-booth="330" style="top: 10%; left: 41%; width: 3.5%; height: 3%;"></div>
        </div>

        <!-- Exhibitor Table -->
        <div class="table-container">
            <table class="exhibitor-table">
                <thead>
                    <tr>
                        <th>Exhibitor Name</th>
                        <th>Booth Number(s)</th>
                    </tr>
                </thead>
                <tbody id="exhibitor-list">
                    <tr data-booths="310">
                        <td><a href="https://www.acornfarms.com/" target="_blank">Acorn Farms</a></td>
                        <td>310</td>
                    </tr>
                    <tr data-booths="110, 112">
                        <td><a href="https://acuspray.com/" target="_blank">AcuSpray</a></td>
                        <td>110, 112</td>
                    </tr>
                    <tr data-booths="409, 508">
                        <td><a href="https://www.advancedturf.com/" target="_blank">Advanced Turf Solutions</a></td>
                        <td>409, 508</td>
                    </tr>
                    <tr data-booths="129">
                        <td><a href="https://aginfotech.net/" target="_blank">Ag Info Tech</a></td>
                        <td>129</td>
                    </tr>
                    <tr data-booths="229, 231, 328, 330">
                        <td><a href="https://www.agprocompanies.com/ohio/" target="_blank">Ag-Pro Companies</a></td>
                        <td>229, 231, 328, 330</td>
                    </tr>
                    <!-- Add the rest of your original table rows here following the same format -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Interaction Logic -->
    <script>
        const booths = document.querySelectorAll('.booth');
        const rows = document.querySelectorAll('#exhibitor-list tr');

        function clearActive() {
            booths.forEach(b => b.classList.remove('active'));
            rows.forEach(r => r.classList.remove('active'));
        }

        // Map Click -> Highlights Table Row
        booths.forEach(booth => {
            booth.addEventListener('click', () => {
                clearActive();
                booth.classList.add('active');
                
                const boothId = booth.getAttribute('data-booth');
                const targetRow = Array.from(rows).find(row => 
                    row.getAttribute('data-booths').includes(boothId)
                );

                if (targetRow) {
                    targetRow.classList.add('active');
                    targetRow.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            });
        });

        // Table Row Click -> Highlights Map Booth
        rows.forEach(row => {
            row.addEventListener('click', (e) => {
                if(e.target.tagName.toLowerCase() === 'a') return; 

                clearActive();
                row.classList.add('active');
                
                const boothIds = row.getAttribute('data-booths').split(', ');
                boothIds.forEach(id => {
                    const targetBooth = document.querySelector(`.booth[data-booth="${id}"]`);
                    if (targetBooth) targetBooth.classList.add('active');
                });
            });
        });
    </script>
</body>
</html>
